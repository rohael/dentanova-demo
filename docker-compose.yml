services:
  dentanova:
    build: .
    image: dentanova-demo:latest
    container_name: dentanova-demo
    restart: unless-stopped
    # Domyślnie port tylko na localhost - na świat wystawia go Cloudflare Tunnel.
    # Adres i port zmienisz w pliku .env (wzór: .env.example).
    ports:
      - "${DENTANOVA_BIND:-127.0.0.1}:${DENTANOVA_PORT:-8095}:80"
